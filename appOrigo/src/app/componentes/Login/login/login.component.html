<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Moderno</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-image: url('https://www.turismo.rj.gov.br/wp-content/uploads/2023/07/WhatsApp-Image-2023-07-19-at-14.59.20.jpeg');
      /* background: linear-gradient(135deg, #4e54c8, #8f94fb); */
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
    }

    .login-card {
      background: #fff;
      border-radius: 15px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .form-control {
      padding-left: 40px;
    }

    .form-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6c757d;
    }

    .input-group {
      position: relative;
    }

    .btn-primary {
      background-color: #4e54c8;
      border: none;
    }

    .btn-primary:hover {
      background-color: #3d42b3;
    }
  </style>
</head>

<body>

  <div class="login-card shadow p-5" @fadeSlideIn>
    <h3 class="text-center mb-4">Login</h3>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3 d-grid">
        <p-iftalabel>
          <p-iconfield>
            <p-inputicon class="pi pi-user" />
            <input class="form-control" pInputText formControlName="email" placeholder="E-mail" />
            <label for="email">Username</label>
          </p-iconfield>
        </p-iftalabel>
      </div>
      <div class="mb-3 d-grid">
        <p-iftalabel>
          <p-iconfield>
            <p-inputicon class="pi pi-key" />
            <input class="form-control" pInputText formControlName="senha" placeholder="Senha" type="password" />
            <label for="senha">Senha</label>
          </p-iconfield>
        </p-iftalabel>
      </div>
      <div class="mb-3 d-grid">
        <p-button type="submit" [style]="{'width': '100%'}" [disabled]="!loginForm.valid || isLoading">
          @if (!isLoading) {
          <span class="d-flex align-items-center">
        Acessar
          </span>
          }
          @if (isLoading) {
          <div class="spinner-container">
            <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s"
              [style]="{ width: '24px', height: '24px' }" />
          </div>
          }
        </p-button>
      </div>
      <p class="text-center"><a href="#" class="text-decoration-none">Esqueceu a senha?</a></p>
    </form>

          @if (visible()) {
        <p-message [life]="3000" severity="error">{{ errorMessage+ msnErro}}</p-message>
    }



  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
